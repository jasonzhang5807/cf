<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>制作自定义图集 — 合成记忆</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;line-height:1.4;padding:18px;background:#f6f7fb;color:#111}
    .wrap{max-width:760px;margin:0 auto;background:#fff;padding:18px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
    h1{font-size:18px;margin:0 0 12px}
    .row{margin:10px 0}
    button{padding:8px 12px;border-radius:6px;border:0;background:#1e88e5;color:#fff;cursor:pointer}
    input[type=file]{display:block}
    .muted{color:#666;font-size:13px}
    .preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .preview img{max-width:120px;max-height:120px;object-fit:contain;border:1px solid #eee}
    .actions{display:flex;gap:8px;margin-top:12px}
    .log{margin-top:10px;font-size:13px;color:#444;background:#f3f5fb;padding:8px;border-radius:6px;max-height:160px;overflow:auto}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>制作 / 上传 自定义图集（前端完成，保留原始尺寸）</h1>
    <p class="muted">上传一个包含 1.png, 2.png, ... 的 .zip，或直接选择多张图片（文件名中包含数字序号）。页面会保留每张图片的原始像素尺寸（宽×高），并将 rect 写入 localStorage，使游戏使用原始大小。</p>

    <div class="row">
      <label>选择文件（zip 或 多张图片）</label>
      <input id="fileInput" type="file" accept=".zip,image/*" multiple />
    </div>

    <div class="row">
      <label>需要的水果数量（从 1.png 到 N.png，默认 6）</label>
      <input id="count" type="number" value="6" min="1" style="width:80px" />
    </div>

    <div class="row actions">
      <button id="processBtn">处理并生成 Zip（下载）</button>
      <button id="installBtn" style="background:#00a86b">安装到本地并返回游戏</button>
      <button id="previewBtn" style="background:#666">预览当前已选</button>
      <a id="backGame" href="game.html" style="align-self:center;margin-left:auto;color:#1e88e5;text-decoration:none">回到游戏</a>
    </div>

    <div class="row">
      <div class="muted">预览（按原始像素等比显示，最大 120px）</div>
      <div id="preview" class="preview"></div>
    </div>

    <div class="row log" id="log"></div>
  </div>

  <!-- JSZip CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script>
  (function(){
    const fileInput = document.getElementById('fileInput');
    const processBtn = document.getElementById('processBtn');
    const installBtn = document.getElementById('installBtn');
    const previewBtn = document.getElementById('previewBtn');
    const preview = document.getElementById('preview');
    const logEl = document.getElementById('log');
    const countInput = document.getElementById('count');

    function log(msg){ logEl.innerText = (new Date()).toLocaleTimeString() + '  ' + msg + '\n' + logEl.innerText }

    // 保留原始尺寸：把 image 直接绘制到与 naturalWidth/naturalHeight 相同的 canvas
    function drawOriginalToCanvas(img) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const w = img.naturalWidth || img.width;
      const h = img.naturalHeight || img.height;
      canvas.width = w;
      canvas.height = h;
      ctx.drawImage(img, 0, 0, w, h);
      return canvas;
    }

    function fileListToMap(files) {
      const map = {};
      for (const f of files) {
        map[f.name] = f;
      }
      return map;
    }

    async function processFilesToImages(entriesMap, neededCount) {
      // 结果数组：index 从 1 到 neededCount -> { blob, dataURL, width, height }
      const results = new Array(neededCount + 1).fill(null);
      for (let i=1;i<=neededCount;i++){
        const name1 = `${i}.png`;
        const name2 = `${i}.jpg`;
        const name3 = `${i}.jpeg`;
        const file = entriesMap[name1] || entriesMap[name2] || entriesMap[name3];
        if(!file) continue;
        const url = URL.createObjectURL(file);
        await new Promise((res,rej)=>{
          const img = new Image();
          img.onload = () => {
            try{
              const canvas = drawOriginalToCanvas(img);
              const w = canvas.width, h = canvas.height;
              canvas.toBlob((blob)=>{
                const reader = new FileReader();
                reader.onload = function(e){
                  results[i] = { blob, dataURL: e.target.result, width: w, height: h };
                  URL.revokeObjectURL(url);
                  res();
                };
                reader.onerror = rej;
                reader.readAsDataURL(blob);
              }, 'image/png');
            }catch(e){ URL.revokeObjectURL(url); log('处理出错: '+name1); res(); }
          };
          img.onerror = function(err){ URL.revokeObjectURL(url); log('图片加载失败: '+name1); res(); };
          img.src = url;
        });
        log(`处理 ${i}.png 完成（保留原始尺寸）`);
      }
      return results;
    }

    async function buildZipAndDownload(results) {
      const zip = new JSZip();
      for (let i=1;i<results.length;i++){
        const item = results[i];
        if(item && item.blob) {
          zip.file(`${i}.png`, item.blob);
        }
      }
      const content = await zip.generateAsync({type:'blob'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(content);
      a.download = 'custom_fruits.zip';
      document.body.appendChild(a);
      a.click();
      setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 5000);
      log('zip 下载触发');
    }

    function saveToLocalStorage(results) {
      // 建立 overrideFruit_v1 格式：数组元素包含 src,name,offset,rect（rect 使用原始宽高）
      const names = ['葡萄','未知2','未知3','未知4','未知5','大西瓜'];
      const arr = [];
      for (let i=1;i<results.length;i++){
        const item = results[i];
        if(item && item.dataURL){
          const name = (names[i-1] !== undefined) ? names[i-1] : ('第'+i+'图');
          arr.push({
            src: item.dataURL,
            name: name,
            offset: [0,0],
            rect: [0,0,item.width,item.height]
          });
        } else {
          arr.push(null);
        }
      }
      localStorage.setItem('overrideFruit_v1', JSON.stringify(arr));
      log('已写入 localStorage（overrideFruit_v1），rect 使用原始像素尺寸，返回游戏即可生效');
    }

    async function handleFileList(files, neededCount){
      log('开始处理文件...');
      const zipFile = Array.from(files).find(f=>/\.zip$/i.test(f.name));
      if(zipFile){
        log('检测到 zip，尝试读取...');
        const jszip = new JSZip();
        const z = await jszip.loadAsync(zipFile);
        const entriesMap = {};
        for (const name of Object.keys(z.files)){
          const short = name.split('/').pop();
          if (/^\d+\.(png|jpg|jpeg)$/i.test(short)){
            const num = parseInt(short,10);
            if(num>=1 && num<=neededCount){
              const blob = await z.files[name].async('blob');
              entriesMap[short] = new File([blob], short, {type: blob.type});
            }
          }
        }
        return await processFilesToImages(entriesMap, neededCount);
      } else {
        const entries = {};
        for (const f of files){
          const short = f.name.split('/').pop();
          if(/^\d+\.(png|jpg|jpeg)$/i.test(short)){
            entries[short] = f;
          } else {
            const m = short.match(/(\d+)/);
            if(m){
              const num = parseInt(m[1],10);
              if(num>=1 && num<=neededCount){
                entries[`${num}.png`] = f;
              }
            }
          }
        }
        return await processFilesToImages(entries, neededCount);
      }
    }

    previewBtn.addEventListener('click', async ()=>{
      preview.innerHTML = '';
      const files = fileInput.files;
      if(!files || files.length===0){ log('请先选择文件'); return; }
      const needed = Math.max(1, parseInt(countInput.value)||6);
      const results = await handleFileList(files, needed);
      results.forEach((it, idx)=>{
        if(idx===0) return;
        const img = document.createElement('img');
        if(it && it.dataURL) img.src = it.dataURL;
        else { img.style.opacity = .15; img.alt = idx; }
        preview.appendChild(img);
      });
      log('预览已更新');
    });

    processBtn.addEventListener('click', async ()=>{
      const files = fileInput.files;
      if(!files || files.length===0){ log('请先选择文件'); return; }
      const needed = Math.max(1, parseInt(countInput.value)||6);
      const results = await handleFileList(files, needed);
      await buildZipAndDownload(results);
    });

    installBtn.addEventListener('click', async ()=>{
      const files = fileInput.files;
      if(!files || files.length===0){ log('请先选择文件'); return; }
      const needed = Math.max(1, parseInt(countInput.value)||6);
      const results = await handleFileList(files, needed);
      saveToLocalStorage(results);
      setTimeout(()=>{ window.location.href = 'game.html'; }, 800);
    });

  })();
  </script>
</body>
</html>
